[package]
name = "noctua"
version = "0.3.5"
edition = "2021"
description = "Research-paper explorer: Semantic Scholar citation graphs, a native PDF library and LaTeX notes"

# The desktop app (Tauri) lives in app/. Plain `cargo build` / `cargo run`
# builds only the independent server/CLI, without desktop dependencies.
[workspace]
members = ["app", "crates/client"]
default-members = ["."]

[workspace.package]
version = "0.3.5"

[dependencies]
noctua-client = { path = "crates/client" }
anyhow = "1"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html5ever = "0.39"
semver = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-stream = "0.1"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
roxmltree = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Lifecycle/update tests repeatedly hash large debug executables. Optimize the
# SHA-256 implementation without removing integrity checks or server debug info.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
