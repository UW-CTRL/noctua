[package]
name = "noctua"
version.workspace = true
edition = "2021"
description = "Research-paper explorer: Semantic Scholar citation graphs, a native PDF library and LaTeX notes"

# The desktop app (Tauri) lives in app/. Plain `cargo build` / `cargo run`
# builds only the browser version, without the desktop dependencies.
[workspace]
members = ["app"]
default-members = ["."]

[workspace.package]
version = "0.2.5"

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-stream = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
