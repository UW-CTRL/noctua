name: release-server

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing server version tag (for example, server-v0.3.5)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-server-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate server release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 .github/scripts/check-release-version.py "$RELEASE_TAG" --server
      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate server signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NOCTUA_UPDATER_PUBLIC_KEY: ${{ vars.NOCTUA_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          python3 -c 'import base64, os; key = base64.b64decode(os.environ["NOCTUA_UPDATER_PUBLIC_KEY"], validate=True).decode(); assert key.startswith("untrusted comment:"), "Invalid updater public key"'

  build:
    needs: prepare
    uses: ./.github/workflows/build-server.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAURI_CLI_VERSION: '2.10.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: server-dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: server-dist
        run: sha256sum --check *.sha256
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Tauri signer
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/noctua-tauri-cli
          key: tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}
      - name: Install Tauri signer
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked --root "${{ runner.temp }}/noctua-tauri-cli"
      - name: Sign server update metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          export PATH="${{ runner.temp }}/noctua-tauri-cli/bin:$PATH"
          for manifest in server-dist/server-update-*.json; do
            cargo tauri signer sign "$manifest"
          done
      - name: Publish server release without changing Latest desktop release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-server.cjs');
            await publish({ github, context, tag: process.env.RELEASE_TAG, commit: process.env.RELEASE_COMMIT });
