name: Check release CI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    outputs:
      commit:
        value: ${{ jobs.check.outputs.commit }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require successful main checks for the tagged commit
        id: check
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const check = require('./.github/scripts/check-release-ci.cjs');
            const commit = await check({ github, context, tag: process.env.RELEASE_TAG });
            core.setOutput('commit', commit);
