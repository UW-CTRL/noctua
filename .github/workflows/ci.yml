name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'NOTICE'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and test the backend
        run: cargo test --locked -p noctua -p noctua-client
      - name: Build lifecycle test server
        run: cargo build --locked -p noctua
      - name: Test detached server lifetime
        run: python3 tests/server-detach.py
      - name: Test isolated server lifecycle and authentication
        run: python3 tests/server-lifecycle.py
      - name: Test server recovery
        run: python3 tests/server-recovery.py
      - name: Build next-version update fixture
        run: python3 tests/build-update-fixture.py
      - name: Test coordinated server updates
        run: python3 tests/server-update.py
      - name: Test paper compiler ownership across server updates
        run: python3 tests/server-paper-lifecycle.py

  frontend:
    name: Frontend tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test JavaScriptCore and WebKit behavior
        env:
          SWIFT_MODULECACHE_PATH: ${{ runner.temp }}/noctua-swift-module-cache
        run: |
          bash tests/run-frontend.sh
          node tests/pdf-comments.cjs

  desktop:
    name: Desktop check (${{ matrix.platform }})
    needs: release-checks
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    env:
      TAURI_CLI_VERSION: '2.10.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            targets: ""
            args: ""
          - platform: ubuntu-22.04
            targets: ""
            args: ""
    steps:
      - name: Skip compilation when native inputs are unchanged
        if: needs.release-checks.outputs.run_desktop == 'false'
        run: echo "Only web assets, documentation, or tests changed; desktop compilation is not needed."
      - uses: actions/checkout@v4
        if: needs.release-checks.outputs.run_desktop != 'false'
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: needs.release-checks.outputs.run_desktop != 'false' && matrix.platform == 'ubuntu-22.04'
        run: |
          # Avoid the Azure mirror's intermittently stalled package downloads.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        if: needs.release-checks.outputs.run_desktop != 'false'
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        if: needs.release-checks.outputs.run_desktop != 'false'
      # Use the same tarfile implementation on all runners; Ubuntu 22.04
      # system Python rejects valid relative symlinks in the TinyTeX archive.
      - uses: actions/setup-python@v5
        if: needs.release-checks.outputs.run_desktop != 'false'
        with:
          python-version: '3.12'
      - name: Restore managed paper compilers
        if: needs.release-checks.outputs.run_desktop != 'false'
        uses: actions/cache@v4
        with:
          path: |
            target/tectonic
            target/texlive
          key: paper-compilers-v2-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('scripts/setup-tectonic.py', 'scripts/setup-pdflatex.py', 'third-party/tectonic/**', 'third-party/texlive/**') }}
      - name: Prepare managed paper compiler
        if: needs.release-checks.outputs.run_desktop != 'false'
        shell: bash
        run: |
          python scripts/setup-tectonic.py
          python scripts/setup-pdflatex.py
      - name: Check the desktop app
        if: needs.release-checks.outputs.run_desktop != 'false'
        run: cargo check --locked -p noctua-app ${{ matrix.args }}
      - name: Exercise real paper compilation
        if: needs.release-checks.outputs.run_desktop != 'false'
        shell: bash
        run: |
          cargo build --locked --bin noctua
          python -m unittest discover -s tests -p test_paper_synctex.py
          python tests/server-detach.py
          python tests/paper-integration.py
      - name: Preserve failed paper compilation diagnostics
        if: failure() && needs.release-checks.outputs.run_desktop != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: paper-diagnostics-${{ matrix.platform }}
          path: target/paper-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # Tag runs can restore default-branch caches, but not another tag's cache.
      - name: Warm release Tauri CLI cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/noctua-tauri-cli
          key: tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}
      - name: Prepare release Tauri CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked --root "${{ runner.temp }}/noctua-tauri-cli"

  release-checks:
    name: Release and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_desktop: ${{ steps.changes.outputs.run_desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect changes requiring desktop compilation
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const detect = require('./.github/scripts/desktop-changes.cjs');
            await detect({ context, core });
      - name: Test release validation, publication, change detection, and note preservation
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/*.test.cjs
      - name: Check the current version configuration
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 .github/scripts/check-release-version.py "v$version"
      - name: Lint GitHub Actions workflows
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml
