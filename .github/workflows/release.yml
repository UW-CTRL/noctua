# Validate a version tag, build installers in one draft, then publish on success.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/check-release-ci.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  prepare:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      commit: ${{ steps.commit.outputs.sha }}
      updater: ${{ steps.updater.outputs.enabled }}
      macos_arch: ${{ steps.macos.outputs.arch }}
      standalone: ${{ steps.server.outputs.enabled }}
      server_version: ${{ steps.server.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.commit }}

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 .github/scripts/check-release-version.py "$RELEASE_TAG"

      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Preserve manual rebuilds of older Universal tags without moving their source.
      - name: Resolve macOS release architecture
        id: macos
        run: |
          python3 -c "from pathlib import Path; lines = Path('.github/workflows/release.yml').read_text().splitlines(); print('arch=' + ('universal' if any(line.strip() == 'args: --target universal-apple-darwin' for line in lines) else 'aarch64'))" >> "$GITHUB_OUTPUT"

      - name: Resolve independent server packaging
        id: server
        run: |
          if [ -f .github/scripts/configure-prebuilt-server.py ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            python3 -c 'import tomllib; m = tomllib.load(open("Cargo.toml", "rb")); v = m["package"]["version"]; print("version=" + (v if isinstance(v, str) else m["workspace"]["package"]["version"]))' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate update signing configuration
        id: updater
        env:
          NOCTUA_UPDATER_PUBLIC_KEY: ${{ vars.NOCTUA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -f app/tauri.release.conf.json ]; then
            test -n "$NOCTUA_UPDATER_PUBLIC_KEY" || { echo 'Missing NOCTUA_UPDATER_PUBLIC_KEY repository variable'; exit 1; }
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret'; exit 1; }
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare draft release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const prepare = require('./.github/scripts/prepare-release.cjs');
            await prepare({ github, context, core, tag: process.env.RELEASE_TAG });

  server-build:
    needs: prepare
    if: needs.prepare.outputs.standalone == 'true' && needs.prepare.outputs.macos_arch != 'universal'
    uses: ./.github/workflows/build-server.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}

  build:
    needs: [prepare, server-build]
    if: always() && needs.prepare.result == 'success' && (needs.server-build.result == 'success' || needs.server-build.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            server_target: aarch64-apple-darwin
            args: --target ${{ needs.prepare.outputs.macos_arch == 'universal' && 'universal-apple-darwin' || 'aarch64-apple-darwin' }}
          - platform: windows-latest
            server_target: x86_64-pc-windows-msvc
            args: ""
          - platform: ubuntu-22.04
            server_target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_CLI_VERSION: '2.10.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (needs.prepare.outputs.macos_arch == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'aarch64-apple-darwin') || '' }}

      - uses: Swatinem/rust-cache@v2

      # Rust cache cleanup can delete non-Cargo files under target/.
      # Restore managed compiler resources only after that cleanup finishes.
      # Use the same tarfile implementation on all runners; Ubuntu 22.04
      # system Python rejects valid relative symlinks in the TinyTeX archive.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore managed paper compilers
        uses: actions/cache@v4
        with:
          path: |
            target/tectonic
            target/texlive
          key: paper-compilers-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'macOS' && needs.prepare.outputs.macos_arch == 'universal' && 'universal' || 'native' }}-${{ hashFiles('scripts/setup-tectonic.py', 'scripts/setup-pdflatex.py', 'third-party/tectonic/**', 'third-party/texlive/**') }}
      - name: Prepare managed paper compiler
        shell: bash
        run: |
          python scripts/setup-tectonic.py ${{ runner.os == 'macOS' && needs.prepare.outputs.macos_arch == 'universal' && '--universal' || '' }}
          python scripts/setup-pdflatex.py

      - name: Configure update verification key
        if: needs.prepare.outputs.updater == 'true'
        uses: actions/github-script@v7
        env:
          NOCTUA_UPDATER_PUBLIC_KEY: ${{ vars.NOCTUA_UPDATER_PUBLIC_KEY }}
          RELEASE_PLATFORM: ${{ runner.os }}
        with:
          script: |
            const fs = require('node:fs');
            const pubkey = process.env.NOCTUA_UPDATER_PUBLIC_KEY?.trim();
            if (!pubkey || !Buffer.from(pubkey, 'base64').toString('utf8').startsWith('untrusted comment:')) {
              throw new Error('NOCTUA_UPDATER_PUBLIC_KEY must contain the complete base64-encoded public key file.');
            }
            const path = 'app/tauri.release.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.bundle ??= {};
            config.bundle.targets = { macOS: ['app', 'dmg'], Windows: ['nsis'], Linux: ['appimage', 'deb'] }[process.env.RELEASE_PLATFORM];
            if (!config.bundle.targets) throw new Error('Unsupported release platform');
            config.bundle.createUpdaterArtifacts = true;
            config.plugins ??= {};
            config.plugins.updater = { ...config.plugins.updater, pubkey };
            // Hooks otherwise run from the frontend root, outside app/.
            // Apply this from the selected workflow so older draft tags can recover.
            if (fs.existsSync('app/prepare-server.py')) {
              config.build ??= {};
              config.build.beforeBuildCommand = {
                script: 'python3 prepare-server.py',
                cwd: require('node:path').resolve('app'),
              };
            }
            fs.writeFileSync(path, JSON.stringify(config, null, 2));

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Avoid the Azure mirror's intermittently stalled package downloads.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Restore Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/noctua-tauri-cli
          key: tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked --root "${{ runner.temp }}/noctua-tauri-cli"

      - name: Add Tauri CLI to PATH
        shell: bash
        run: echo "${{ runner.temp }}/noctua-tauri-cli/bin" >> "$GITHUB_PATH"

      - name: Download prebuilt server
        if: needs.prepare.outputs.standalone == 'true' && needs.prepare.outputs.macos_arch != 'universal'
        uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.server_target }}
          path: prebuilt-server
      - name: Configure prebuilt server for desktop packaging
        if: needs.prepare.outputs.standalone == 'true' && needs.prepare.outputs.macos_arch != 'universal'
        shell: bash
        env:
          SERVER_TARGET: ${{ matrix.server_target }}
        run: python .github/scripts/configure-prebuilt-server.py

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOCTUA_UPDATER_PUBLIC_KEY: ${{ vars.NOCTUA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # The publication job generates one manifest after every upload completes.
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ needs.prepare.outputs.updater == 'true' && '--config tauri.release.conf.json' || '' }}

      # Read packaging checks from the selected workflow, including draft rebuilds.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Verify packaged server and paper compilers
        env:
          NOCTUA_REQUIRE_MACOS_UPDATER: ${{ needs.prepare.outputs.updater }}
        shell: bash
        run: python release-tools/.github/scripts/check-release-resources.py

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Use the workflow's helper so a manual run can publish an older tagged draft.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify installers and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          UPDATER_ENABLED: ${{ needs.prepare.outputs.updater }}
          NOCTUA_RELEASE_SERVER_VERSION: ${{ needs.prepare.outputs.server_version }}
          MACOS_ARCH: ${{ needs.prepare.outputs.macos_arch }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-release.cjs');
            await publish({ github, context, core, tag: process.env.RELEASE_TAG, releaseId: process.env.RELEASE_ID,
              updaterEnabled: process.env.UPDATER_ENABLED === 'true', macosArch: process.env.MACOS_ARCH });
