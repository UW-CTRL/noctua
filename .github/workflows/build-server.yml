name: build-server

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone server
        run: cargo build --locked --release -p noctua --target ${{ matrix.target }}
      - name: Smoke test and package server
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python .github/scripts/package-server.py
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: server-dist/*
          if-no-files-found: error
