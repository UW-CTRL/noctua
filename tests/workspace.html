const approvals=[];
async function api(path,body){if(path.startsWith('/api/chat-edit-approvals/')){approvals.push({path,...body});return {approved:body.approve};}if(path.includes('/files/')&&!path.endsWith('/history'))return {entry:server.entries[1],text:source,revision:server.revision,history:server.history};if(path.endsWith('/history'))return {};if(path==='/api/workspaces/L1'){if(body){if(body.revision!==server.revision)throw Error('Project changed');if(body.op==='create'||body.op==='folder'){server.entries.push({id:'created'+server.revision,kind:body.op==='folder'?'folder':'file',name:body.name,parent:body.parent,deleted:false});}else if(body.op==='move'){if(rejectMove)throw Error('Move failed');server.entries.find(e=>e.id===body.id).parent=body.parent;}else if(body.op==='delete'){if(rejectDelete)throw Error('Unable to move to trash');const ids=new Set([body.id]);for(let i=0;i<server.entries.length;i++)for(const e of server.entries)if(ids.has(e.parent))ids.add(e.id);for(const e of server.entries)if(ids.has(e.id))e.deleted=true;}else if(body.op==='restore'){server.entries.find(e=>e.id===body.id).deleted=false;}else source=body.text;server.revision++;server.history={undo:'Edit file'};}return clone(server);}throw Error('Unexpected API '+path);}
async function createNote(title){const doc={id:'new-note',title};N.doc=doc;N.list.push(doc);W.file=null;server.entries.push({id:'new-note-entry',kind:'note',note:doc.id,name:title,parent:'',deleted:false});await loadWorkspace('L1');return doc;}
function typeset(){} function renderEditor(){$('#notes-stage').textContent='No document open';} function stopEdit(){} async function saveNow(){} function toast(s){errors.push(s)}
window.prompt=window.confirm=()=>{throw Error('Native dialogs must not be used');};
// Drain mocked API promises, then allow one task for dialog close events.
// MessageChannel yields a task without background WebKit timer throttling.
async function settle(){for(let i=0;i<20;i++)await Promise.resolve();await new Promise(resolve=>{const channel=new MessageChannel();channel.port1.onmessage=()=>{channel.port1.close();channel.port2.close();resolve();};channel.port2.postMessage(null);});}
function assert(ok,message){if(!ok)throw Error(message)}
</script>
