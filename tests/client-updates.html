<!doctype html><meta charset="utf-8"><title>Desktop startup update regression</title>
<iframe src="../app/dist/index.html" style="width:100%;height:520px"></iframe><pre id="result">Checking…</pre>
<script>
const assert=(value,message)=>{if(!value)throw Error(message)};
document.querySelector('iframe').onload=async()=>{try{
 const w=document.querySelector('iframe').contentWindow,d=w.document,calls=[];
 w.__TAURI_INTERNALS__={invoke:async(command,args)=>{
  calls.push({command,args});
  if(command==='client_state')return{version:'0.1.0',connection:{},service:{supported:true,enabled:false}};
  if(command==='desktop_action')return{status:'available',current_version:'0.1.0',version:'0.3.0',releases:[]};
  return{};
 }};
 assert(!d.querySelector('#tab-desktop')&&!d.querySelector('#panel-desktop'),'server management still exposes app updates');
 d.querySelector('#connection-dialog').close();
 await w.performDesktop('startup_check',null,{startup:true});
 const offer=d.querySelector('#app-update-dialog');
 assert(offer?.open&&calls.some(c=>c.command==='present_client'),'startup update offer must remain available');
 offer.querySelector('[data-dismiss]').click();await Promise.resolve();
 assert(calls.some(c=>c.command==='dismiss_connection')&&!calls.some(c=>c.command==='local_server'),'deferral must return to content without starting a server');
 const result='PASS: server management excludes app updates and startup update offer remains available';document.querySelector('#result').textContent=result;window.webkit?.messageHandlers.result.postMessage(result);
}catch(error){const result='FAIL: '+error.message+'\n'+error.stack;document.querySelector('#result').textContent=result;window.webkit?.messageHandlers.result.postMessage(result);}};
</script>
