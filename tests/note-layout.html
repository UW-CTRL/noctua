<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Note layout</title>
<link rel="stylesheet" href="../web/style.css"><link rel="stylesheet" href="../web/icons.css">
<style>main{--left-w:260px;grid-template-columns:260px minmax(0,1fr)}#notes-stage{height:100%}</style>
</head><body class="notes-mode">
<header><span class="brand">Noctua</span><div class="mode-switch"><button data-mode="notes" class="active" data-icon="notebook-pen">Notes</button></div></header>
<main><aside id="left"><div id="notes-side"><ul id="note-list"></ul></div>
<div id="research-sidebar"><div id="tab-library" class="tab-body">
        <div id="collection-tools" class="workspace-tools" aria-label="Collections">
          <strong id="collection-tools-title">Collections</strong>
          <div role="group" aria-label="Create and import files in the selected collection">
            <button data-new-file data-icon="file-plus" data-icon-only aria-label="New note or file"></button>
            <button data-new-folder data-icon="folder-plus" data-icon-only aria-label="New project folder"></button>
            <button data-import-file data-icon="file-up" data-icon-only aria-label="Import files"></button>
          </div>
        </div>
<div id="graph-folders"><ul id="lib-tree" class="tree"><li data-id="L1" style="padding-left:8px"><span class="t-name">Research</span></li><li data-id="C2" style="padding-left:16px"><span class="t-name">Other</span></li></ul></div>
<div class="list-tools"><input id="lib-filter"></div><ul id="lib-items"></ul></div>
<div id="graph-list-switch" class="tabs">Papers</div></div></aside><section id="notes-stage" data-notes-theme="light"></section></main>
<div id="details" hidden></div><div id="cite-picker" hidden></div>
<script>
const $=s=>document.querySelector(s), enc=encodeURIComponent,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get:()=>null,set(){}},collections={targets:[{id:'L1',name:'Research'}]},chat={id:'chat'};
const collectionOptions=()=>'',noteRefHtml=()=>'',noteImageUrl=()=>'',captureVideos=()=>[],restoreVideos=()=>{},applyImgSel=()=>{};
function toast(s){throw Error(s)} function updateChatContext(){}
async function api(){return {undo:'Edit note',redo:null}}
function assert(ok,message){if(!ok)throw Error(message)}
</script>
<script src="../web/select.js"></script><script src="../web/latex.js"></script><script src="../web/edit-history.js"></script><script src="../web/ink.js"></script><script src="../web/notes.js"></script><script src="../web/workspace.js"></script>
<script>
(async()=>{
N.target='L1';N.doc={id:'note',title:'Reading notes',preamble:'',blocks:[{id:'b1',type:'text',src:String.raw`\section{Research questions}
Connect ideas, collect evidence, and keep the next question close.
\begin{itemize}\item What assumptions does this method make?\item Which results should we reproduce?\end{itemize}`}]};N.list=[{id:'note',title:N.doc.title}];
W.target='L1';W.manifest={entries:[{id:'sources',kind:'folder',name:'Sources'},{id:'note-entry',kind:'note',note:'note',name:'Reading notes'},{id:'bib',kind:'file',name:'references.bib'}],history:{}};
resetNoteHistory();renderEditor();renderWorkspaceTree();
await Promise.resolve();
for(const width of [220,320]){
 document.querySelector('main').style.gridTemplateColumns=width+'px minmax(0,1fr)';
 const head=$('#collection-tools').getBoundingClientRect(),title=$('#collection-tools-title').getBoundingClientRect(),actions=$('#collection-tools [role="group"]').getBoundingClientRect();
 assert(title.right<=actions.left&&actions.right<=head.right+1,'collection heading and create actions fit one row');
 assert(Math.abs((title.top+title.bottom)/2-(actions.top+actions.bottom)/2)<6,'collection heading and create actions align');
}
document.querySelector('main').style.gridTemplateColumns='';
assert(!$('#notes-target')&&!$('#note-new')&&!$('.notes-side-head')&&document.querySelectorAll('.workspace-tools').length===1,'one shared collection header, no collection dropdown');
assert(getComputedStyle($('#lib-tree')).display!=='none'&&getComputedStyle($('#lib-items')).display==='none'&&getComputedStyle($('#graph-list-switch')).display==='none','notes show the Library collection tree without paper lists');
const nested=$('#lib-tree > li[data-id="L1"] + li.tree-files #workspace-tree');
assert(nested&&$('#lib-tree > li[data-id="C2"]').previousElementSibling.classList.contains('tree-files'),'project files sit under their collection row');
renderWorkspaceTree();assert(document.querySelectorAll('#workspace-tree').length===1&&$('#lib-tree li.tree-files #workspace-tree')===nested,'tree updates keep files in place');
assert(!$('.note-toolbar'),'no separate top bar');
assert($('#notes-stage>.note-actions [data-undo]')&&$('#notes-stage>.note-actions #note-help'),'actions belong to writing area');
assert($('[data-file="note-entry"]').getAttribute('aria-current')==='page','open note visibly selected');
for(const width of [400,760]){
 $('#notes-stage').style.width=width+'px';layoutNoteTitle();
 const stage=$('#notes-stage').getBoundingClientRect(),page=$('.note-page').getBoundingClientRect();
 assert(page.width<=stage.width,'default page fits narrow writing pane');
 const undo=$('.note-actions [data-undo]').getBoundingClientRect(),settings=$('#note-preamble-toggle').getBoundingClientRect();
 assert(undo.left-stage.left<=14&&stage.right-settings.right<=24,'controls sit at panel edges');
 const title=$('.note-title').getBoundingClientRect();
 assert(Math.abs((title.left+title.right)/2-(stage.left+stage.right)/2)<2,'editable title centered between action groups');
 assert(title.top>=undo.bottom&&title.top>=settings.bottom,'title is in document below fixed controls');
 assert(undo.top-stage.top<=6&&settings.top-stage.top<=6,'fixed controls sit close to top edge');
 const meta=$('.note-meta').getBoundingClientRect();
 const head=$('.note-head').getBoundingClientRect(),headStyle=getComputedStyle($('.note-head'));
 assert(Math.abs(meta.left-head.left)<1&&meta.top>=title.bottom,'metadata aligns with divider left edge below title');
 assert(parseFloat(headStyle.borderBottomWidth)===1&&headStyle.borderBottomStyle==='solid'&&meta.bottom<head.bottom,'divider remains below collection and save status');
 assert(title.top-stage.top>=24,'title retains top breathing room');
 assert($('.note-actions').getBoundingClientRect().height<=36,'compact document actions');
}
$('#notes-stage').style.width='';layoutNoteTitle();
const field=$('.note-title'),shortHeight=field.getBoundingClientRect().height;
field.value='A long research note title that should wrap naturally within the document divider instead of overflowing horizontally '.repeat(3);field.dispatchEvent(new Event('input',{bubbles:true}));
assert(field.getBoundingClientRect().height>shortHeight*2&&field.scrollWidth<=field.clientWidth+1,'long title grows into multiple lines without horizontal overflow');
const titleRect=field.getBoundingClientRect(),divider=$('.note-head').getBoundingClientRect();
assert(Math.abs(titleRect.left-divider.left)<2&&Math.abs(titleRect.right-divider.right)<2,'title width matches divider when space permits');
field.value='Updated title';field.dispatchEvent(new Event('input',{bubbles:true}));clearTimeout(N.saveTimer);N.dirty=false;
assert(field.getBoundingClientRect().height===shortHeight,'title shrinks after removing extra text');
$('.note-blocks').style.minHeight='1600px';
const top=$('.note-actions').getBoundingClientRect().top,titleTop=$('.note-title').getBoundingClientRect().top;
$('#notes-stage').scrollTop=500;
assert($('#notes-stage').scrollTop===500,'test scrolls the document');
assert(Math.abs($('.note-actions').getBoundingClientRect().top-top)<1,'controls stay visible while scrolling');
assert(Math.abs($('.note-title').getBoundingClientRect().top-(titleTop-500))<1,'title scrolls with the document instead of sticking');
assert($('#note-help').getBoundingClientRect().top>=top,'right controls remain visible');
$('#notes-stage').scrollTop=titleTop-top+8;
const center=$('.note-title').getBoundingClientRect();
assert(getComputedStyle($('.note-actions')).backgroundColor==='rgba(0, 0, 0, 0)','fixed controls must not paint across the note');
assert(document.elementFromPoint((center.left+center.right)/2,top+8)===$('.note-title'),'center of fixed controls must not block title editing');
assert(getComputedStyle($('#note-help')).pointerEvents==='auto','edge controls remain clickable');
$('#notes-stage').scrollTop=0;$('.note-blocks').style.minHeight='';
const title=$('.note-title');title.value='Updated title';title.dispatchEvent(new Event('input',{bubbles:true}));
assert(N.doc.title==='Updated title'&&N.dirty,'center title still edits the note and schedules autosave');
clearTimeout(N.saveTimer);N.dirty=false;
$('#note-preamble-toggle').click();assert($('.note-preamble textarea')&&$('#note-preamble-toggle').getAttribute('aria-expanded')==='true','preamble opens with expanded state');
$('#note-preamble-toggle').click();assert(!$('.note-preamble'),'preamble closes');
$('#note-help').click();assert($('#note-help-dialog').open,'help opens');$('#note-help-dialog').close();
for(const theme of ['dark','light']){setNotesTheme(theme);const style=getComputedStyle($('#notes-stage'));assert(style.colorScheme===theme,'note theme remains independent');}
N.doc.preamble=String.raw`\geometry{paperwidth=12in}`;applyPreamble();assert(parseFloat($('.note-page').style.width)>760,'explicit paper geometry preserved');
N.doc.preamble='';applyPreamble();
N.doc.blocks=Array.from({length:40},(_,i)=>({id:'s'+i,type:'text',src:'Paragraph '+i+'\n\n'+'words '.repeat(80)}));
renderEditor();$('#notes-stage').scrollTop=900;const kept=$('#notes-stage').scrollTop;
assert(kept>800,'long note scrolls');
renderEditor();assert(Math.abs($('#notes-stage').scrollTop-kept)<2,'re-rendering the open note keeps its scroll position');
startEdit('s30');assert(Math.abs($('#notes-stage').scrollTop-kept)<2,'restoring the caret after a re-render does not scroll');
N.editing=null;N.keepScroll?.();
$('#notes-stage').style.width='1300px';await new Promise(r=>setTimeout(r,60));
N.doc.blocks=[{id:'ink',type:'ink',w:1000,h:.4,strokes:[]},{id:'tex',type:'text',src:'Converted $x$',beside:true},{id:'after',type:'text',src:'Next'}];
renderEditor();await new Promise(r=>setTimeout(r,60));
const pair=$('.nb-pair'),cells=[...pair.children].map(c=>c.getBoundingClientRect());
assert(pair&&pair.children.length===2&&cells[1].left>=cells[0].right&&Math.abs(cells[0].top-cells[1].top)<2,'converted LaTeX sits beside its drawing');
assert(pair.getBoundingClientRect().width>$('.note-blocks').getBoundingClientRect().width,'drawing rows use the panel width');
assert($('.nb[data-id="tex"] [data-act="below"]')&&!$('.nb[data-id="after"] [data-act="beside"]'),'only text after a drawing offers the layout toggle');
await blockAction('tex','below');clearTimeout(N.saveTimer);N.dirty=false;
assert(!$('.nb-pair')&&!N.doc.blocks[1].beside&&$('.nb[data-id="tex"] [data-act="beside"]'),'show below stacks the LaTeX under the drawing');
$('#notes-stage').style.width='';
window.webkit.messageHandlers.result.postMessage('PASS: sticky edge controls, centered editable title, narrow panes, active notes, preamble, help, independent themes, explicit geometry, the shared collection tree, and LaTeX beside drawings');
})().catch(e=>window.webkit.messageHandlers.result.postMessage('FAIL: '+e.stack));
</script></body></html>
