<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../web/style.css"><link rel="stylesheet" href="../web/pdf.css"></head><body>
<script>
const calls=[],messages=[];let failure=false,gate=null,settings={};
function assert(value,message){if(!value)throw Error(message);}
function toast(message){messages.push(message);}
async function api(path,body){calls.push({path,body});if(path.startsWith('/api/workspaces/'))return {revision:7};if(gate)await gate;if(failure)throw Error('Zotero database unavailable');return {papers:2,pdfs:0,notes:1,annotations:0,warnings:[]};}
async function loadCollections(){}async function loadLibItems(){}
const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
</script><script src="../web/library.js"></script><script>
(async()=>{
 const list=document.createElement('div');list.id='lib-tree';list.tabIndex=0;document.body.append(list);
 window.lib={target:'C1'};window.enc=encodeURIComponent;
 const uploads=[];window.notifyProgress=()=>{};
 window.fetch=async(path,opts)=>{uploads.push({path,body:opts.body});return {ok:true,json:async()=>({key:'pasted'})};};
 let readerOpens=0;openPaperView=async()=>{readerOpens++;};
 const pdf=new File(['%PDF-test'],'Copied.pdf',{type:'application/pdf'});
 const pasteAt=(element,files)=>{const event=new Event('paste',{bubbles:true,cancelable:true});Object.defineProperty(event,'clipboardData',{value:{files}});element.dispatchEvent(event);return event;};
 assert(pasteAt(list,[pdf]).defaultPrevented,'PDF paste did not claim collection clipboard');await tick();
 assert(uploads.length===1&&uploads[0].path.includes('target=C1')&&uploads[0].body===pdf,'clipboard PDF lost selected target or file');
 assert(readerOpens===0,'PDF paste must keep the current list instead of opening Reader');
 const input=document.createElement('input');list.append(input);
 assert(!pasteAt(input,[pdf]).defaultPrevented,'clipboard import hijacked text editing');
 const textFile=new File(['text'],'notes.txt',{type:'text/plain'});
 assert(pasteAt(list,[textFile]).defaultPrevented,'general file paste not handled');await tick();await tick();
 assert(uploads.length===2&&uploads[1].path.includes('/api/workspaces/C1/upload?name=notes.txt&revision=7')&&uploads[1].body===textFile,'general file not stored in selected workspace');
 assert(messages.some(message=>message.includes('Notes → Project files')),'general file destination not explained');
 pasteAt(list,[new File(['zip'],'archive.zip'),pdf]);await tick();await tick();await tick();
 assert(uploads.length===4&&uploads[2].path.includes('archive.zip')&&uploads[3].path.includes('import-pdf'),'mixed file routing failed');
 assert(!pasteAt(list,[]).defaultPrevented,'text clipboard should remain native');
 assert(readerOpens===0,'mixed clipboard import must not open Reader');
 list.remove();calls.length=0;
 window.G={libKey:null};window.esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
 window.renderDetails=()=>{};lib.detail={key:'delete-me'};
 await confirmDeleteLibraryPaper({key:'delete-me',title:'Delete <this>',revision:4});
 let deletion=document.querySelector('.library-delete-dialog');
 assert(document.activeElement===deletion.querySelector('[type="submit"]'),'Delete must be focused for Enter confirmation');
 deletion.querySelector('[data-cancel]').click();await tick();
 assert(!document.querySelector('.library-delete-dialog'),'cancel did not close deletion');
 await confirmDeleteLibraryPaper({key:'delete-me',title:'Delete <this>',revision:4});
 deletion=document.querySelector('.library-delete-dialog');
 await deletion.querySelector('form').onsubmit({preventDefault(){}});await tick();
 assert(uploads.at(-1).path==='/api/library/papers/delete-me'&&JSON.parse(uploads.at(-1).body).revision===4,'delete request lost paper or revision');
 assert(!document.querySelector('.library-delete-dialog')&&lib.detail===null,'delete did not clear removed detail');

 await importZoteroLibrary();let dialog=document.querySelector('dialog'),form=dialog.querySelector('form');
 assert(dialog.open&&calls.length===0,'opening dialog must not import');
 assert(dialog.getAttribute('aria-labelledby')==='zotero-import-title','dialog title is not accessible');
 assert([...form.querySelectorAll('input')].every(input=>input.checked),'default selections missing');
 assert(form.elements.pdf_mode.value==='link','default PDF mode must link originals');
 assert(form.elements.import_mode.value==='sync','default existing-item mode must sync');
 await importZoteroLibrary();assert(document.querySelectorAll('dialog').length===1,'duplicate import dialogs');
 form.querySelector('[data-cancel]').click();await tick();assert(calls.length===0&&!document.querySelector('dialog'),'cancel imported or left dialog behind');
 settings.zotero_pdf_mode='copy';
 await importZoteroLibrary();dialog=document.querySelector('dialog');form=dialog.querySelector('form');
 assert(form.elements.pdf_mode.value==='copy','saved PDF default not applied');
 form.elements.pdf_mode.value='link';
 form.elements.import_mode.value='overwrite';
 form.elements.copy_pdfs.click();assert(!form.elements.copy_annotations.checked,'annotations remained enabled without PDF');
 form.elements.copy_annotations.click();assert(form.elements.copy_pdfs.checked,'annotations did not select PDFs');
 form.elements.copy_pdfs.click();form.elements.tags.checked=false;form.elements.bibliography.checked=false;
 let release;gate=new Promise(resolve=>release=resolve);failure=true;
 const pending=form.onsubmit({preventDefault(){}});await form.onsubmit({preventDefault(){}});
 assert(calls.length===1&&form.querySelector('[type="submit"]').disabled,'duplicate submission or enabled busy form');
 assert(form.querySelector('[data-cancel]').disabled,'cancel enabled during import');
 assert(calls[0].body.copy_notes&&!calls[0].body.copy_pdfs&&!calls[0].body.copy_annotations&&!calls[0].body.tags&&!calls[0].body.bibliography,'unchecked choices not sent');
 assert(calls[0].body.pdf_mode==='link'&&settings.zotero_pdf_mode==='copy','per-import mode override changed settings or was not sent');
 assert(calls[0].body.import_mode==='overwrite','overwrite selection was not sent');
 release();await pending;gate=null;
 assert(dialog.open&&form.querySelector('.error').textContent.includes('unavailable'),'failure closed dialog or hid error');
 assert(!form.elements.tags.checked&&!form.querySelector('[type="submit"]').disabled,'retry lost choices or stayed disabled');
 assert(form.elements.pdf_mode.value==='link'&&form.elements.pdf_mode.disabled,'retry lost PDF selection or dependency');
 assert(form.elements.import_mode.value==='overwrite','retry lost overwrite selection');
 failure=false;await form.onsubmit({preventDefault(){}});await tick();
 assert(!document.querySelector('dialog')&&calls.length===2,'successful retry did not close dialog');
 assert(messages.some(s=>s.includes('1 notes')),'import summary missing');
 await importZoteroLibrary();dialog=document.querySelector('dialog');form=dialog.querySelector('form');
 form.elements.pdf_mode.value='link';await form.onsubmit({preventDefault(){}});await tick();
 assert(calls.at(-1).path==='/api/settings/zotero-pdf'&&calls.at(-1).body.pdf_mode==='link'&&settings.zotero_pdf_mode==='link','successful PDF import did not remember choice');
 await importZoteroLibrary();dialog=document.querySelector('dialog');form=dialog.querySelector('form');
 assert(form.elements.pdf_mode.value==='link','remembered PDF choice not restored');
 form.querySelector('[data-cancel]').click();await tick();
 window.webkit.messageHandlers.result.postMessage('PASS: Zotero import selection, dependencies, cancel, busy state, errors and retry');
})().catch(e=>window.webkit.messageHandlers.result.postMessage('FAIL: '+e.stack));
</script></body></html>
