<script type="module">

 const engine=await import('../web/vendor/pdfjs/build/pdf.mjs');engine.GlobalWorkerOptions.workerSrc=new URL('../web/vendor/pdfjs/build/pdf.worker.mjs',location.href).href;pdfEngine=Promise.resolve(engine);
 const lines=[['Learning Reliable World Models',54,744,19],['A fictional research paper for the Noctua Reader demo',54,721,10],['Abstract',54,684,14],['We introduce a stable latent dynamics model that learns directly',54,658,12],['from visual observations using a compact predictive objective.',54,641,12],['1  Method',54,602,14],['Our method combines a shared visual encoder with an action-',54,576,12],['conditioned predictor and a simple regularization objective.',54,559,12],['2  Results',54,520,14],['The model improves prediction accuracy across three environments',54,494,12],['while reducing the computational cost of downstream planning.',54,477,12],['3  Limitations',54,438,14],['Performance depends on the diversity of the offline training data.',54,412,12],['Long-horizon predictions can lose fine-grained visual details.',54,395,12],['Encoder',91,296,12],['Predictor',262,296,12],['Latent state',435,296,12],['Figure 1: A compact predictive learning pipeline.',54,236,11],['A shared encoder maps observations to a latent representation.',54,220,11],['The predictor estimates the next state conditioned on an action.',54,204,11],['References',54,155,14],['[1] A. Researcher. Stable predictive representations. 2025.',54,131,11],['[2] B. Scientist. Efficient visual planning. 2024.',54,115,11]];

 window.demoScene=async name=>{

 };
 await window.demoScene('outline');window.demoReady=true;
