<!doctype html><meta charset="utf-8"><script src="../web/browser-connect.js"></script><script>
(async()=>{try{
const api=NoctuaBrowserConnection,assert=(v,m)=>{if(!v)throw Error(m)};
for(const value of ['http://remote.example','https://u:p@example.com','https://example.com/path','https://example.com/?token=x','javascript:alert(1)']){let rejected=false;try{api.address(value)}catch{rejected=true}assert(rejected,'unsafe address accepted: '+value)}
assert(api.address('https://example.com/')==='https://example.com'&&api.address('http://localhost:47878')==='http://localhost:47878','supported address rejected');
const originalOpen=window.open,originalAdd=window.addEventListener,originalRemove=window.removeEventListener;
let listener,popup,opened,saveCount=0,sent=[],removed=false;
window.addEventListener=(name,fn)=>{if(name==='message')listener=fn;else originalAdd.call(window,name,fn)};
window.removeEventListener=(name,fn)=>{if(name==='message')removed=true;else originalRemove.call(window,name,fn)};
window.open=url=>{opened=new URL(url);popup={closed:false,close(){this.closed=true},postMessage(data,origin){sent.push({data,origin})}};return popup};
let pending=api.connect('http://localhost:47902','private-token',async()=>{saveCount++});
const id=opened.searchParams.get('id'),ready={source:popup,origin:'http://localhost:47902',data:{type:'noctua-connect-ready',id}};
assert(!opened.href.includes('private-token'),'token leaked into URL');
await listener({...ready,origin:'https://wrong.example'});await listener({...ready,source:{}});await listener({...ready,data:{...ready.data,id:'wrong'}});
assert(saveCount===0&&sent.length===0,'untrusted message caused login');
await listener(ready);assert(saveCount===1&&sent[0].data.token==='private-token'&&sent[0].origin==='http://localhost:47902','save or origin-bound handoff failed');
await listener({...ready,data:{type:'noctua-connect-result',id,ok:true,server:{api_version:1,ready:true,server_id:'target'}}});
assert(await pending==='http://localhost:47902/shell'&&popup.closed&&removed,'successful handoff cleanup failed');
pending=api.connect('http://localhost:47902','private-token',async()=>{});
const v2id=opened.searchParams.get('id');
await listener({source:popup,origin:'http://localhost:47902',data:{type:'noctua-connect-ready',id:v2id}});
await listener({source:popup,origin:'http://localhost:47902',data:{type:'noctua-connect-result',id:v2id,ok:true,server:{api_version:2,ready:true,server_id:'target'}}});
assert(await pending==='http://localhost:47902/shell','external-UI server generation rejected');
sent=[];pending=api.connect('http://localhost:47902','private-token',async()=>{throw Error('save failed')});
const failed=pending.then(()=>false,e=>e.message==='save failed');
await listener({source:popup,origin:'http://localhost:47902',data:{type:'noctua-connect-ready',id:opened.searchParams.get('id')}});
assert(await failed&&sent.length===0&&popup.closed,'failed save leaked credentials or changed connection');
window.open=()=>null;let blocked=false;try{await api.connect('https://example.com','token',async()=>{})}catch{blocked=true}assert(blocked,'blocked popup must report failure');
window.open=originalOpen;window.addEventListener=originalAdd;window.removeEventListener=originalRemove;
window.webkit.messageHandlers.result.postMessage('PASS: browser server addresses, origin/window/nonce binding, save-before-auth, URL secret exclusion, blocked popups and failed-save cleanup');
}catch(e){window.webkit.messageHandlers.result.postMessage('FAIL: '+e.stack)}})();
</script>
