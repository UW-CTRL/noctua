<script>
const assert=(v,m)=>{if(!v)throw Error(m)};
document.querySelector('iframe').onload=async()=>{try{
 const frame=document.querySelector('iframe'),w=frame.contentWindow,d=frame.contentDocument,calls=[];
 w.__TAURI_INTERNALS__={invoke:async(command,args)=>{calls.push({command,args});if(command==='client_state')return{connection:{},service:{supported:true,enabled:false},local:null};if(command==='connect_server'){if(args.address.includes('offline'))throw Error('Connection failed');return{server_id:'server-A',api_version:1,ready:true}};return{}}};

 eval(shellSource.slice(shellSource.indexOf('function safeTabPath'),shellSource.indexOf('function addTab')));
 assert(safeTabPath('//outside.example')==='/'&&safeTabPath('/\\outside.example')==='/'&&safeTabPath('/#note=kept')==='/#note=kept','tab restoration allowed another origin');
 const start=shellSource.indexOf('async function flushFrame'),end=shellSource.indexOf('newBtn.addEventListener',start);

 // Real browser storage: reload the draft module without clearing storage, as a page restart does.
 const doc={id:'same-note',updated:10,title:'Kept offline',blocks:[{id:'b',type:'text',src:'typed while disconnected'}]};
 const sent=NoteDrafts.put('L1',doc);assert(NoteDrafts.get('L1',doc.id).title==='Kept offline','draft not durable');

 NoteDrafts.server='server-A';const newer=NoteDrafts.put('L1',{...doc,title:'Newer input'});
 NoteDrafts.acknowledge('L1',doc.id,sent);assert(NoteDrafts.get('L1',doc.id).title==='Newer input','late server acknowledgment deleted a newer draft');
 NoteDrafts.acknowledge('L1',doc.id,newer);assert(!NoteDrafts.get('L1',doc.id),'matching acknowledgment did not clear draft');
 // Two editors keep separate durable slots, including across module reinitialization.
 const firstOwner=NoteDrafts.owner;
 const own=NoteDrafts.put('L1',doc);
 NoteDrafts.owner='second-editor';const other=NoteDrafts.put('L1',{...doc,title:'Different unsaved input'});
 assert(NoteDrafts.candidates('L1',doc.id).length===2,'second editor overwrote the first draft');
 NoteDrafts.owner=firstOwner;NoteDrafts.acknowledge('L1',doc.id,own);
 assert(NoteDrafts.candidates('L1',doc.id).length===1&&NoteDrafts.get('L1',doc.id).title==='Different unsaved input','one editor cleared another editor draft');

 const reloaded=Function(draftSource+';return NoteDrafts;')();
 assert(reloaded.get('L1',doc.id).title==='Different unsaved input','reload could not recover another editor draft');

 const noteSource=await(await fetch('../web/notes.js')).text(),N={target:'L1'};
 const toast=()=>{};
 eval(noteSource.slice(noteSource.indexOf('function chooseLocalDraft'),noteSource.indexOf('async function showNote')));
 const choices=NoteDrafts.candidates('L1',doc.id),choice=chooseLocalDraft(choices);
 const dialog=document.querySelector('dialog.local-draft-recovery');
 assert(dialog?.open&&dialog.querySelectorAll('section').length===2,'multiple drafts did not offer a recovery choice');
 dialog.querySelector('section button').click();
 assert((await choice).key===choices[0].key,'recovery selected the wrong editor draft');
