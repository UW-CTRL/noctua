<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../web/style.css"></head>
<body><button id="previous-focus">Previous focus</button>
<script>
const settings = { desktop: true, skipped: true, version: '0.1.0' };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyNeeded = s => !s.skipped;
let calls = [], fail = false, confirmCalls = 0, status = 'available', notifications = [];
function toast(message,options){notifications.push({message,options});}
window.confirm = () => { confirmCalls++; throw new Error('Native confirmation is unavailable in the desktop tab'); };
async function api(path, body) {
  calls.push({path, body});
  if (fail) throw new Error('Network unavailable');
  return {status, current_version:'0.1.0', version:'0.3.0', releases:[
    {version:'0.3.0', changes:[{kind:'features', items:['Startup update prompts']}]},
    {version:'0.2.0', changes:[{kind:'fixes', items:['Preserve <settings>']}]}]};
}
const assert = (value, message) => { if (!value) throw new Error(message); };
const until = async predicate => {
  for (let i = 0; i < 100; i++) { if (predicate()) return; await new Promise(resolve => setTimeout(resolve, 5)); }
  throw new Error('Dialog operation did not finish');
};
window.addEventListener('load', async () => {
  try {
    const previous = document.querySelector('#previous-focus'); previous.focus();
    await checkStartupUpdate({desktop:false, skipped:true});
    await checkStartupUpdate({desktop:true, skipped:false});
    assert(calls.length === 0, 'browser mode or first-run setup checked for updates');
    fail = true; await checkStartupUpdate(); fail = false;
    assert(!document.querySelector('dialog'), 'offline startup showed a dialog');
    await checkStartupUpdate();
    let dialog = document.querySelector('#app-update-dialog');
    assert(dialog?.open, 'available update did not show a modal');
    assert(calls.at(-1).body.action === 'startup_check', 'startup did not use the native once-per-launch action');
    assert(dialog.textContent.includes('0.1.0 → 0.3.0'), 'current-to-latest version range missing');
    assert(dialog.querySelectorAll('.update-release').length === 2, 'skipped release summary missing');
    assert(!dialog.querySelector('settings') && dialog.textContent.includes('Preserve <settings>'), 'highlight markup was interpreted as HTML');
    assert(document.activeElement === dialog.querySelector('[data-dismiss]'), 'safe dismissal was not focused');
    showUpdatePrompt({version:'0.4.0'});
    assert(document.querySelectorAll('#app-update-dialog').length === 1, 'duplicate prompt appeared');
    const before = calls.length;
    dialog.querySelector('[data-dismiss]').click();
    assert(!document.querySelector('dialog') && calls.length === before, 'Not now installed an update');
    assert(document.activeElement === previous, 'focus not restored after dismissal');
    const history = [{version:'0.3.0', changes:[]}].concat(Array.from({length:30}, (_, i) => ({
      version:`0.2.${29-i}`, changes:[{kind:'fixes', items:['A release highlight '.repeat(5), 'Another release highlight '.repeat(4)]}]
    })));
    showUpdatePrompt({current_version:'0.1.0', version:'0.3.0', releases:history});
    dialog = document.querySelector('#app-update-dialog');
    const summary = dialog.querySelector('.update-summary');
    assert(summary.tabIndex === 0 && summary.getAttribute('role') === 'region' && summary.getAttribute('aria-label') === 'Release history', 'history is not keyboard accessible');
    summary.focus();
    assert(document.activeElement === summary, 'history cannot receive keyboard focus');
    assert(summary.scrollHeight > summary.clientHeight && summary.clientHeight > 0, 'long history does not have a usable scroll area');
    assert(dialog.querySelectorAll('.update-release').length === history.length, 'skipped releases were truncated');
    const headings = [...dialog.querySelectorAll('.update-release h4')];
    assert(headings[0].textContent.includes('0.3.0') && headings.at(-1).textContent.includes('0.2.0'), 'history order or oldest skipped release is wrong');
    const lastNotes = headings.at(-1).querySelector('a');
    assert(lastNotes.href.endsWith('/releases/tag/v0.2.0'), 'oldest skipped release lacks its full notes link');
    const actions = dialog.querySelector('.setup-actions');
    const actionsTop = actions.getBoundingClientRect().top;
    lastNotes.scrollIntoView({block:'nearest'});
    assert(summary.scrollTop > 0, 'cannot scroll to the oldest skipped release');
    const notesRect = lastNotes.getBoundingClientRect(), summaryRect = summary.getBoundingClientRect();
    assert(notesRect.top >= summaryRect.top - 1 && notesRect.bottom <= summaryRect.bottom + 1, 'oldest release notes are clipped');
    assert(Math.abs(actions.getBoundingClientRect().top-actionsTop) < 1, 'history scrolling moved the action buttons');
    const dialogRect = dialog.getBoundingClientRect(), actionsRect = actions.getBoundingClientRect();
    assert(dialogRect.top >= 0 && dialogRect.bottom <= innerHeight + 1 && actionsRect.bottom <= innerHeight, 'long history pushed the dialog or buttons out of the viewport');
    dialog.querySelector('[data-dismiss]').click();
    // Deferring does not consume the supplied history on the next launch/offer.
    showUpdatePrompt({current_version:'0.1.0', version:'0.3.0', releases:history});
    dialog = document.querySelector('#app-update-dialog');
    assert(dialog.querySelectorAll('.update-release').length === history.length, 'deferring lost release history');
    dialog.querySelector('[data-dismiss]').click();
    status = 'skipped'; await checkStartupUpdate();
    assert(!document.querySelector('dialog'), 'native skip response showed another prompt');
    status = 'current'; await checkStartupUpdate();
    assert(!document.querySelector('dialog'), 'current version showed an update prompt');
    status = 'available'; await checkStartupUpdate();
    dialog = document.querySelector('dialog');
    let button = dialog.querySelector('[data-update-action]');
    fail = true; button.click(); await until(() => !button.disabled);
    assert(calls.at(-1).body.version === '0.3.0', 'installation did not pin the displayed version');
    assert(confirmCalls === 0, 'startup prompt asked for confirmation twice');
    assert(notifications.at(-1)?.message==='Network unavailable' && notifications.at(-1)?.options.error && button.dataset.updateAction === 'check', 'installation error did not offer retry');
    fail = false; status = 'available'; button.click(); await until(() => !button.disabled);
    status = 'installed'; button.click(); await until(() => !button.disabled);
    assert(button.dataset.updateAction === 'restart' && button.textContent === 'Restart Noctua', 'successful install did not offer restart');
    button.click(); await until(() => !button.disabled);
    assert(calls.at(-1).body.action === 'restart', 'restart action missing');
    dialog.dispatchEvent(new Event('cancel', {cancelable:true}));
    assert(!document.querySelector('dialog'), 'Escape did not dismiss the prompt');
    const section = document.createElement('section');
    section.innerHTML = '<button data-update-action="install" data-update-version="0.3.0">Update to 0.3.0</button>';
    const settingsDialog = document.createElement('dialog');
    settingsDialog.appendChild(section);
    document.body.appendChild(settingsDialog);
    settingsDialog.showModal();
    button = section.querySelector('button');
    button.focus();
    const beforeInstall = calls.length;
    let operation = updateApp(button, section, () => {});
    dialog = document.querySelector('#app-update-confirm-dialog');
    assert(dialog?.open, 'Settings install did not show an in-app confirmation');
    assert(settingsDialog.open, 'confirmation closed Settings');
    assert(await confirmUpdateInstall('0.3.0') === false && document.querySelectorAll('#app-update-confirm-dialog').length === 1, 'duplicate confirmation was opened');
    assert(calls.length === beforeInstall, 'Settings installed before confirmation');
    assert(document.activeElement === dialog.querySelector('[data-cancel]'), 'Cancel was not focused');
    dialog.querySelector('[data-cancel]').click(); await operation;
    assert(calls.length === beforeInstall && !dialog.isConnected, 'Cancel installed an update or leaked the confirmation');
    assert(document.activeElement === button, 'confirmation did not restore Settings focus');
    operation = updateApp(button, section, () => {});
    dialog = document.querySelector('#app-update-confirm-dialog');
    dialog.dispatchEvent(new Event('cancel', {cancelable:true})); await operation;
    assert(calls.length === beforeInstall && !dialog.isConnected, 'Escape installed an update or leaked the confirmation');
    operation = updateApp(button, section, () => {});
    dialog = document.querySelector('#app-update-confirm-dialog');
    dialog.querySelector('[data-confirm]').click(); await operation;
    assert(calls.length === beforeInstall + 1 && calls.at(-1).body.action === 'install' && calls.at(-1).body.version === '0.3.0', 'confirmed Settings install did not request the displayed version');
    assert(button.dataset.updateAction === 'restart', 'Settings install did not offer restart');
    assert(confirmCalls === 0, 'update flow used native confirm');
    settingsDialog.close(); settingsDialog.remove();
    window.webkit.messageHandlers.result.postMessage('PASS: update states, long skipped-release history, scrolling, visible actions, full notes links, keyboard focus, deferral, and Settings confirmation');
  } catch (error) { window.webkit.messageHandlers.result.postMessage('FAIL: '+error.message+' '+error.stack); }
});
</script></body></html>
