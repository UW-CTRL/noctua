<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Connect · Noctua</title>
<style>body{font:16px system-ui;max-width:480px;margin:15vh auto;padding:24px;background:#faf9f6;color:#292923}input,button{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box;width:100%}p{line-height:1.6}</style>
<h1>Connect to Noctua</h1><p>Enter this server's authentication token. In a desktop app, Server &amp; connection remains available even when the server is offline.</p>
<form><input type="password" aria-label="Server token" autocomplete="current-password" required><button>Connect</button></form><p role="status"></p>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const i=document.querySelector('input'),s=document.querySelector('[role=status]');try{const r=await fetch('/auth/login',{method:'POST',headers:{Authorization:'Bearer '+i.value,'X-Noctua-Client':'1'}});i.value='';if(!r.ok)throw Error('Authentication failed');const v=await(await fetch('/api/server')).json();if(v.api_version!==1||!v.ready)throw Error('Incompatible or unavailable server; update or choose another server');location.replace('/shell')}catch(e){s.textContent=e.message}};</script></html>
