<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect · Noctua</title>
<link rel="stylesheet" href="/connection.css"><script src="/appearance.js"></script><script src="/fonts.js"></script></head>
<body><main class="connection-page connection-login"><p class="connection-eyebrow">Noctua</p><h1>Connect to Noctua</h1>
<section class="connection-card"><p>Enter this server’s authentication token. Desktop connection settings remain available even when the server is offline.</p>
<form><label class="connection-field">Authentication token<input type="password" autocomplete="current-password" required></label><button class="primary">Connect</button></form><p class="connection-status" role="status"></p></section></main>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const i=document.querySelector('input'),s=document.querySelector('[role=status]'),b=document.querySelector('button');b.disabled=true;s.textContent='Checking connection…';delete s.dataset.state;try{const r=await fetch('/auth/login',{method:'POST',headers:{Authorization:'Bearer '+i.value,'X-Noctua-Client':'1'}});i.value='';if(!r.ok)throw Error('Authentication failed');const v=await(await fetch('/api/server')).json();if(v.api_version!==1||!v.ready)throw Error('Incompatible or unavailable server; update or choose another server');location.replace('/shell')}catch(e){s.textContent=e.message;s.dataset.state='error'}finally{b.disabled=false}};</script></body></html>
