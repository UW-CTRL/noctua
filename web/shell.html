<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Noctua</title>
  <style>
    :root { --bg: #e9e7e1; --tab: #f7f6f2; --ink: #1d1f24; --muted: #6b6f78; --line: #d6d3ca; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0e11; --tab: #121317; --ink: #e8e8ea; --muted: #9a9ea8; --line: #2c2f36; --accent: #8b85ff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--tab); color: var(--ink); overflow: hidden;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    body { display: flex; flex-direction: column; }
    #tabs { display: flex; align-items: flex-end; gap: 2px; height: 34px; padding: 0 6px; background: var(--bg);
      border-bottom: 1px solid var(--line); flex: none; user-select: none; overflow-x: auto; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 6px; min-width: 90px; max-width: 220px; flex: 0 1 200px; height: 28px;
      padding: 0 6px 0 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
      color: var(--muted); cursor: default; }
    .tab:hover { background: color-mix(in srgb, var(--tab) 55%, transparent); }
    .tab.active { background: var(--tab); color: var(--ink); border-color: var(--line); margin-bottom: -1px; height: 29px; }
    .tab.drop { box-shadow: inset 2px 0 0 var(--accent); }
    .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab .x { border: 0; background: none; color: inherit; width: 18px; height: 18px; border-radius: 4px; padding: 0;
      font-size: 13px; line-height: 18px; opacity: 0; }
    .tab:hover .x, .tab.active .x { opacity: .7; }
    .tab .x:hover { opacity: 1; background: color-mix(in srgb, var(--muted) 25%, transparent); }
    #new { border: 0; background: none; color: var(--muted); font-size: 18px; width: 28px; height: 28px; border-radius: 6px; margin-bottom: 1px; flex: none; }
    #new:hover { color: var(--ink); background: color-mix(in srgb, var(--muted) 18%, transparent); }
    #frames { flex: 1; position: relative; }
    #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
    #frames iframe.active { display: block; }
    #menu { position: fixed; z-index: 10; background: var(--tab); border: 1px solid var(--line); border-radius: 8px;
      padding: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
    #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 6px 12px; border-radius: 5px; font: inherit; }
    #menu button:hover { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div id="tabs"><button id="new" title="New tab (⌘T / Ctrl+T)">+</button></div>
  <div id="frames"></div>
  <script src="/shell.js"></script>
</body>
</html>
