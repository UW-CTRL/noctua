[package]
name = "noctua-client"
version = "0.1.0"
edition = "2021"
description = "Noctua client protocol and local server lifecycle"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
libc = "0.2"
minisign-verify = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

