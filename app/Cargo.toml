[package]
name = "noctua-app"
version.workspace = true
edition = "2021"
description = "Noctua desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noctua = { path = ".." }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
serde_json = "1"
axum = "0.8"
semver = "1"
# Release updates use raw NSIS/AppImage files; legacy ZIP support pulls in vulnerable zip 4.x.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSThread"] }
