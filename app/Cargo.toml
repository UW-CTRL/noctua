[package]
name = "noctua-app"
version.workspace = true
edition = "2021"
description = "Noctua desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noctua = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
serde_json = "1"
# Release updates use raw NSIS/AppImage files; legacy ZIP support pulls in vulnerable zip 4.x.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
